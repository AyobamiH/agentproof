name: Production provider check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: services/production-provider
      - run: npm run check
        working-directory: services/production-provider
