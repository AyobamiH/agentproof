name: Stage AgentProof prerelease to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json prerelease version to stage
        required: true
        default: 0.1.0-rc.6
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentproof-npm-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact main with release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted staged publishing support
        run: npm install --global npm@11.21.0

      - name: Verify package, version, and exact GitHub release subject
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const requested = process.env.RELEASE_VERSION;
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));

          if (pkg.name !== "@oneclicksystems/agentproof") {
            throw new Error(`unexpected package name: ${pkg.name}`);
          }
          if (pkg.version !== requested) {
            throw new Error(`package.json is ${pkg.version}, not requested ${requested}`);
          }
          if (!/^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$/.test(requested ?? "")) {
            throw new Error(`expected an explicit prerelease version, got: ${requested ?? "<missing>"}`);
          }
          NODE

          tag="v${RELEASE_VERSION}"
          git fetch --force --tags origin

          if ! git rev-parse --verify "${tag}^{commit}" >/dev/null 2>&1; then
            echo "missing GitHub release tag: ${tag}" >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${tag}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          if [ "${tag_sha}" != "${head_sha}" ]; then
            echo "release tag ${tag} resolves to ${tag_sha}, but main is ${head_sha}" >&2
            echo "Refusing to stage different source bytes under the release version." >&2
            exit 1
          fi

      - name: Refuse an already-published version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set +e
          npm view @oneclicksystems/agentproof versions --json \
            > "${RUNNER_TEMP}/agentproof-versions.json" \
            2> "${RUNNER_TEMP}/agentproof-view.err"
          code="$?"
          set -e

          if [ "$code" -ne 0 ]; then
            if grep -Eq 'E404|404 Not Found' "${RUNNER_TEMP}/agentproof-view.err"; then
              printf '[]\n' > "${RUNNER_TEMP}/agentproof-versions.json"
            else
              cat "${RUNNER_TEMP}/agentproof-view.err" >&2
              exit "$code"
            fi
          fi

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const requested = process.env.RELEASE_VERSION;
          const raw = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/agentproof-versions.json`, "utf8"),
          );
          const versions = Array.isArray(raw) ? raw : raw ? [raw] : [];
          if (versions.includes(requested)) {
            throw new Error(`@oneclicksystems/agentproof@${requested} is already published`);
          }
          NODE

      - name: Install exact dependencies
        run: npm ci

      - name: Run full release checks
        run: npm run check

      - name: Stage prerelease for maintainer review
        run: npm stage publish --tag next --access public
