name: Production provider canary
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: agentproof-production-canary
  cancel-in-progress: false
jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    environment: agentproof-production-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise the exact bounded production authority
        run: node scripts/production-provider-canary.mjs services/production-provider/public-trust.json "$RUNNER_TEMP/production-provider-canary.json"
      - name: Preserve sanitised engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: production-provider-canary
          path: ${{ runner.temp }}/production-provider-canary.json
          if-no-files-found: error
